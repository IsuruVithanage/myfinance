<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · MyFinance</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif; text-align: center;
        padding: 2rem; background: #f6f7f9; color: #0f172a;
      }
      @media (prefers-color-scheme: dark) { body { background: #0b0c0f; color: #f1f5f9; } }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0; opacity: .7; font-size: .95rem; max-width: 22rem; }
      button {
        margin-top: 1.5rem; padding: .75rem 1.25rem; border: 0; border-radius: .75rem;
        background: #4f46e5; color: #fff; font-weight: 600; font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You&rsquo;re offline</h1>
      <p>MyFinance needs a connection to show your real balances. Nothing has been lost — reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
