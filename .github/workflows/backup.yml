name: Nightly database backup

# Your data lives on Neon. This keeps independent, dated copies inside this
# private repository, so losing the Neon project — or a bad delete — is
# recoverable.
#
# Deliberately not pg_dump: that tool refuses to dump a server newer than
# itself, so a pinned client version starts failing silently the day Neon
# upgrades Postgres. `npm run backup` only needs Node.
on:
  schedule:
    - cron: "30 18 * * *" # 00:00 Sri Lanka time (UTC+5:30)
  workflow_dispatch: {}

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export every table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — no backup was taken."
            exit 1
          fi
          npm run backup

      - name: Keep the last 30 nights
        run: ls -1t backups/*.json | tail -n +31 | xargs -r rm --

      - name: Commit
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups
          git diff --staged --quiet || git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push
