name: Nightly database backup

# Your data lives on Neon's free tier. This keeps a second, independent copy
# inside this repository so a lost account or a bad delete is recoverable.
on:
  schedule:
    - cron: "30 18 * * *" # 00:00 Sri Lanka time (UTC+5:30)
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          pg_dump --no-owner --no-privileges "$DATABASE_URL" | gzip > "backups/myfinance-$(date -u +%Y-%m-%d).sql.gz"
          # keep the last 30 nights only, so the repo stays small
          ls -1t backups/*.sql.gz | tail -n +31 | xargs -r rm --

      - name: Commit the backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups
          git diff --staged --quiet || git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push
